<!doctype html><html lang="en"><meta charset="utf-8"><title>Xbox 360 imported theme tests</title><style>html,body{height:100%;margin:0;background:#20251f;color:white;font:15px Segoe UI,Arial,sans-serif}body{display:flex;flex-direction:column}header{padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}select{font:inherit;padding:5px;max-width:440px}a{color:#b6e873}#note{padding:0 18px 8px;color:#ddd}iframe{border:0;flex:1;width:100%}</style><header><strong>Imported Xbox 360 themes</strong><label>Theme <select id="theme"></select></label><label>Dashboard <select id="dashboard"><option value="kinect">Kinect</option><option value="nxe">NXE</option><option value="metro">Metro</option></select></label><a href="kinect-cabinet-chooser.html">11 cabinet wallpapers</a><a href="https://archive.org/download/Xbox_360_Themes_Archivev.1/Xbox%20360%20Themes/" target="_blank" rel="noreferrer">Archive source</a></header><div id="note"></div><iframe title="Interactive imported theme dashboard"></iframe><script type="module">const catalog=await fetch('/out/import-fixtures/x360-archive/catalog.json').then(r=>r.json());const select=document.querySelector('#theme'),dashboard=document.querySelector('#dashboard'),frame=document.querySelector('iframe'),note=document.querySelector('#note');for(const t of catalog){const o=document.createElement('option');o.value=t.id;o.textContent=t.name;select.append(o)}const bridge=new URLSearchParams(location.search).get('avatarBridge')||'http://127.0.0.1:62883';function show(){const t=catalog.find(t=>t.id===select.value);note.textContent=`${t.wallpapers} wallpaper(s) decoded · Package target: ${t.dashStyle===1?'Blades':t.dashStyle===2?'NXE':'any dashboard'}${t.premium?' · Premium: wallpaper preview only; console scenery/animation is not reproduced.':''}`;frame.src='x360-kinect-cabinet.html?'+new URLSearchParams({theme:'x360',xs:dashboard.value,x360skin:t.id,avatarBridge:bridge});}select.onchange=dashboard.onchange=show;show();</script></html>

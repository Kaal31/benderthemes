<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game artwork layout review</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#111922;color:#edf5fa;font:16px system-ui}h1{margin:0 0 10px;font-size:25px}p{color:#bbcad7;line-height:1.6}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}select,button{font:inherit;background:#263a4a;color:white;border:1px solid #647b8d;border-radius:6px;padding:9px}header{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}.screen{position:relative;width:100%;aspect-ratio:1280/800;overflow:hidden;background:#05090c;border:1px solid #536677;border-radius:8px}iframe{position:absolute;width:1304px;height:870px;border:0;transform-origin:top left}a{color:#91dcff}nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.note{min-height:48px;margin-top:8px;font-size:14px}@media(max-width:900px){main{grid-template-columns:1fr}}</style>
<h1>Game artwork layout review</h1><p>Choose any two themes to inspect side by side. These are current interactive layouts using the same sample library and authored console artwork. This is not a historical before/after comparison. Click a screen to navigate it, or use its controls below.</p><main></main>
<script>
const themes=[['switch','Nintendo Switch'],['n3ds','Nintendo 3DS'],['vita','PS Vita'],['ps4','PS4'],['ps5','PS5'],['ps2','PS2'],['wii','Wii'],['wiiu','Wii U Plaza'],['xbox','Original Xbox'],['blades','Xbox 360 Blades'],['nxe','Xbox 360 NXE'],['kinect','Xbox 360 Kinect'],['metro','Xbox 360 Metro'],['aero','Aero'],['aero2','Aero v2'],['castle','Floating Castle'],['republic','Galactic Republic'],['dial','Alien Dial'],['iisu','iiSU'],['silver','Silver Wheel'],['pain','Six Paths'],['nazarick','Nazarick']];
const params=new URLSearchParams(location.search),panels=[];
for(let i=0;i<2;i++){
 const panel=document.createElement('section');panel.innerHTML='<header><label>Theme <select aria-label="Theme '+(i+1)+'">'+themes.map(([id,name])=>'<option value="'+id+'">'+name+'</option>').join('')+'</select></label><a target="_blank">Open full size ↗</a></header><div class="screen"><iframe title="Interactive theme '+(i+1)+'" allow="autoplay;gamepad"></iframe></div><nav>'+[[11,'←'],[9,'↑'],[10,'↓'],[12,'→'],[1,'A · Select'],[2,'B · Back'],[3,'X · Options']].map(([key,name])=>'<button data-key="'+key+'">'+name+'</button>').join('')+'<button data-reset>Restart</button></nav><p class="note"></p>';document.querySelector('main').append(panel);
 const select=panel.querySelector('select'),frame=panel.querySelector('iframe');select.value=params.get(i?'right':'left')||(i?'ps5':'switch');
 function show(){const id=select.value,u=new URL('console-native-connected.html',location.href);u.searchParams.set('theme',['blades','nxe','kinect','metro'].includes(id)?'x360':id);if(['blades','nxe','kinect','metro'].includes(id))u.searchParams.set('xs',id);if(id==='wiiu')u.searchParams.set('plaza','1');u.searchParams.set('still','1');u.searchParams.set('artReview','square-2');frame.src=u;panel.querySelector('a').href=u;panel.querySelector('.note').textContent=id==='wiiu'?'Square icons / logos are preferred. Missing preview icons fall back to a square crop. Full covers remain selectable in Artwork settings.':'Inspect the visible tile shape and artwork fitting. Portrait source images may be cropped into square tiles; libraries and details can use separate cover layouts.';params.set(i?'right':'left',id);history.replaceState(null,'','?'+params);}
 select.onchange=show;panel.querySelector('[data-reset]').onclick=show;panel.querySelectorAll('[data-key]').forEach(button=>button.onclick=()=>frame.contentWindow.dispatchEvent(new frame.contentWindow.CustomEvent('preview-controller-input',{detail:Number(button.dataset.key)})));
 new ResizeObserver(()=>{const scale=frame.parentElement.clientWidth/1280;frame.style.transform='translateX('+(-12*scale)+'px) scale('+scale+')';}).observe(frame.parentElement);panels.push({select,frame});show();
}
</script></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Block Worlds · Frame Test</title><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="style.css"></head>
<body><div id="dashboard">
  <header class="top"><div><strong>BLOCK WORLDS</strong><small>COMMUNITY FRAME TEST</small></div><span id="who">Connecting to ThemeHub…</span><time id="clock">--:--</time></header>
  <nav id="nav" aria-label="Main navigation"></nav>
  <main class="worlds panel"><header><h1 id="list-title">My Games</h1><button id="collection">All collections</button><button id="filter" aria-pressed="false">Installed only</button></header><div class="search-row"><input id="search" aria-label="Search games" placeholder="Search your games"><button id="sort">Recent ↓</button></div><div id="games" role="list" aria-label="Games"><p class="empty">Waiting for your library…</p></div></main>
  <aside class="player panel"><header><h2 id="player-name">Player</h2><span class="tag">IFRAME</span></header><div id="avatar-scene"><canvas id="avatar" aria-label="3D player; drag to rotate"></canvas><p id="avatar-error" hidden>3D is unavailable on this renderer. Your theme still works.</p></div><button id="skin" class="wide">✎ Change Skin</button><div class="selected-box"><small>SELECTED GAME</small><strong id="selected-title">Your library</strong><span id="selected-meta"></span><button id="details" class="wide">Game details</button></div><div class="spectrum" id="spectrum" aria-label="Theme audio spectrum"></div><button id="audio" class="wide">♫ Music player</button><button id="workshop-link" class="wide">Experimental pages →</button><button id="diagnostics" class="wide">Frame diagnostics</button></aside>
  <footer><span><b>A</b> Play</span><span><b>B</b> Back</span><button id="options"><b>X</b> Theme options</button><button id="game-options"><b>Y</b> Game details</button><span class="hint">L1 / R1 · page games</span><span id="status" role="status">Connecting…</span></footer>
  <div id="notice" role="status" hidden></div>
</div><script src="avatar-vendor.js"></script><script src="pages.js"></script><script src="app.js"></script></body></html>

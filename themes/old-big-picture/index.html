<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Old Big Picture</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="classic.css"><link rel="stylesheet" href="reference-pass.css"><link rel="stylesheet" href="pages.css"></head>
<body>
<div class="glow" aria-hidden="true"></div>
<header><button class="brand" data-page="home" aria-label="Big Picture home"><img src="assets/steam_home.png" alt=""><span id="page-title">Big Picture</span></button><button class="profile" data-page="profile"><span class="profile-avatar"><span id="avatar-initial">S</span><img id="steam-avatar" alt="Steam profile picture" hidden></span><span><small>Online</small><span id="user">Connecting…</span></span></button><div class="utilities"><button data-open="downloads" aria-label="Downloads"><img src="assets/downloads.png" alt=""></button><button data-open="settings" aria-label="Settings"><img src="assets/settings.png" alt=""></button><button data-open="power" aria-label="Power"><img src="assets/exit.png" alt=""></button><time id="clock"></time></div></header>
<nav aria-label="Main navigation"><button data-page="store">STORE</button><button data-page="library">LIBRARY</button><button data-page="community">COMMUNITY</button></nav>
<main id="content" aria-live="polite"><p class="message">Connecting to your Steam library…</p></main>
<footer><button data-page="home">◉ <span>Home</span></button><div id="hint"><b>A</b> Select <b>X</b> Play <b>Y</b> Options <b>B</b> Back</div><button data-open="options">Theme options <span>☰</span></button></footer>
<div id="notice" role="status"></div>
<script src="theme-bridge.js"></script><script src="pages.js"></script><script src="app.js"></script></body></html>

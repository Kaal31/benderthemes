<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blue Glass</title><link rel="stylesheet" href="style.css?v=ios5-buttons-6"></head>
<body>
<div id="dashboard">
  <header><div class="brand"><span id="brand-icon"></span> Steam Deck <span id="wifi"></span></div><time id="clock"></time><div class="status"><button data-place="search" aria-label="Search"></button></div></header>
<main class="apps-panel"><div class="apps-heading"><h1>Your Games</h1><span id="game-count"></span></div><div id="apps" aria-label="All games"></div></main>
  <section class="recent"><div class="section-heading"><h2>◷ &nbsp;Recently Played</h2><button data-place="library" class="view-all"><span>View all games</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h5v5H4zM15 5h5v5h-5zM4 15h5v5H4zM15 15h5v5h-5z"/></svg></button></div><div id="shelf" aria-label="Game library"></div><p id="empty" hidden>Your library is empty. Open Library to add your first game.</p></section>
  <footer aria-label="Main navigation"></footer>
</div><script src="audio.js?v=ios5-buttons-6"></script><script src="video.js?v=ios5-buttons-6"></script><script src="pages.js?v=ios5-buttons-6"></script><script src="app.js?v=ios5-buttons-6"></script>

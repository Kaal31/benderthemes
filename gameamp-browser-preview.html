<!doctype html><html><head><meta charset="utf-8"><title>GameAmp — Interactive Preview</title><style>html,body{margin:0;height:100%;background:#142b40;font-family:Segoe UI,Arial;color:white}iframe{width:100%;height:100%;border:0;display:block}#notice{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#102638ed;border:1px solid #a3d8f5;border-radius:8px;padding:14px 22px;box-shadow:0 4px 20px #0008;pointer-events:none}#notice[hidden]{display:none}</style></head><body><iframe id="theme" src="/themes/gameamp/index.html" title="GameAmp theme"></iframe><div style="position:fixed;right:12px;top:40px;z-index:9;font:10px monospace;color:#b9d9ff">SAMPLE LIBRARY PREVIEW</div><div id="notice" hidden></div><script src="/gameamp-preview-library.js"></script><script>const frame=document.getElementById('theme');let timer;window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.dht!==1)return;const m=e.data;if(m.type==='ready')frame.contentWindow.postMessage({dht:1,type:'state',preview:true,games,settings:{clock24:false,animations:true},saved:{}},'*');if(['launch','details','open'].includes(m.type)){const n=document.getElementById('notice');n.textContent=m.type==='open'?'Preview: opens '+m.place+' on your Steam Deck':'Preview: '+(m.type==='launch'?'launch':'game details for')+' '+(games.find(g=>g.appid===m.appid)?.name||'game');n.hidden=false;clearTimeout(timer);timer=setTimeout(()=>n.hidden=true,2200);}});frame.addEventListener('load',()=>frame.focus());</script><script src="/gameamp-preview-services.js"></script><script src="/gameamp-preview-audio.js"></script><script src="/gameamp-preview-sound.js"></script></body></html>

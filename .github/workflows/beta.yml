name: Beta build
on:
  push:
    branches: [benderthemes-beta]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta:
    if: github.ref == 'refs/heads/benderthemes-beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
      - run: npm run package
        env:
          USE_PUBLISHED_ASSETS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: DeckHomeThemes-beta
          path: out/DeckHomeThemes-*.zip

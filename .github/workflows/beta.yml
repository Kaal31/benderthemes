name: Beta build
on:
  push:
    branches: [beta]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  beta:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
      - run: npm run package
        env:
          USE_PUBLISHED_ASSETS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: DeckHomeThemes-beta
          path: out/DeckHomeThemes-*.zip
      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="beta-${GITHUB_SHA:0:12}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/DeckHomeThemes-*.zip --clobber
          else
            gh release create "$TAG" out/DeckHomeThemes-*.zip --target "$GITHUB_SHA" --title "ThemeHub beta (${GITHUB_SHA:0:7})" --notes "Testing build from the beta branch. Uses the existing published theme catalog; rebuilt theme assets are not published by this workflow." --prerelease --latest=false
          fi

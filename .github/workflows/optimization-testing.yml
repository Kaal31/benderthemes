name: Optimization testing
on:
  push:
    branches: [optimization-testing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: node tests/verify-performance.mjs
      - run: node tests/verify-preset-company.mjs
      - run: node tests/verify-controller-compatibility.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/verify-footer-keyboard.mjs
      - run: python -m pip install Pillow
      - run: npm run preview
      - run: node tests/verify-keyboard-skins.mjs
      - run: node tests/verify-performance-ui.mjs

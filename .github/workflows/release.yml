name: Numbered release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: numbered-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: node tests/verify-preset-company.mjs
      - run: node tests/verify-controller-compatibility.mjs
      - run: python -m unittest discover -s tests -p "test_*.py"
      - name: Choose the next version
        id: version
        shell: bash
        run: |
          python tools/next_release_version.py >> "$GITHUB_OUTPUT"
      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/verify-keyboard-diagnostics.mjs
      - run: node tests/verify-keyboard-lifecycle.mjs
      - run: node tests/verify-idle-diagnostics.mjs
      - run: python -m pip install Pillow
      - run: npm run preview
      - run: node tools/capture_theme_previews.mjs
      - run: python tools/make_theme_gifs.py
      - run: node tests/verify-spotlight-install.mjs
      - run: node tests/verify-spotlight-ui.mjs
      - run: node tests/verify-marketplace.mjs
      - run: node tests/verify-theme-options.mjs
      - run: node tests/verify-block-panels.mjs
      - run: node tests/verify-firmware-looks.mjs
      - run: npm run package
        env:
          USE_PUBLISHED_ASSETS: '1' # theme packs live on Kaal31/deckthemes-assets (asset-catalog.json)
      - run: python tools/verify_release.py
        env:
          USE_PUBLISHED_ASSETS: '1'
      - name: Commit version and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Release v${VERSION} [skip ci]"
          fi
          git tag "v${VERSION}"
          git push --atomic origin HEAD:main "v${VERSION}"
      - name: Publish versioned ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" "out/DeckHomeThemes-v${VERSION}.zip" asset-catalog.json --title "ThemeHub v${VERSION}" --generate-notes --draft --verify-tag
          gh release edit "v${VERSION}" --draft=false --latest

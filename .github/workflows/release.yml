name: Numbered release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: numbered-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: node tests/verify-preset-company.mjs
      - name: Choose the next version
        id: version
        shell: bash
        run: |
          python tools/next_release_version.py >> "$GITHUB_OUTPUT"
      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: npm run package
      - name: Commit version and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Release v${VERSION} [skip ci]"
          fi
          git tag "v${VERSION}"
          git push --atomic origin HEAD:main "v${VERSION}"
      - name: Publish versioned ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" "out/DeckHomeThemes-v${VERSION}.zip" --title "Deck Home Themes v${VERSION}" --generate-notes --latest
